<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>电脑监测</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
:root{
  --bg:#0a0e1a;
  --txt:#eef1f7; --txt2:#9aa5b8; --txt3:#6b7688;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.16);
  --red:#ff6b6b; --orange:#ffa94d; --yellow:#ffd43b; --green:#51cf66;
  --teal:#22b8cf; --cyan:#3ddc97; --blue:#4dabf7; --purple:#a78bfa;
  --pink:#f472b6; --lime:#a3e635;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.5;
  padding-bottom:calc(env(safe-area-inset-bottom) + 28px);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 氛围光斑 */
.bg{position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg);}
.blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.6;}
.blob.b1{width:400px;height:400px; background:#5b4ce0; top:-140px; left:-100px;}
.blob.b2{width:360px;height:360px; background:#0ea5e9; top:26%; right:-140px; opacity:.5;}
.blob.b3{width:340px;height:340px; background:#8b2f9b; bottom:-130px; left:12%; opacity:.45;}
.blob.b4{width:260px;height:260px; background:#0d9488; top:58%; left:-90px; opacity:.35;}

/* 顶部 */
.hdr{position:sticky; top:0; z-index:30; padding:14px 16px 12px;
  background:rgba(10,14,26,.7); backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--line);}
.hdr .row{display:flex; align-items:center; gap:12px;}
.logo{width:40px;height:40px; border-radius:12px; flex:none;
  background:linear-gradient(135deg,#6366f1,#22b8cf);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:0 6px 18px rgba(99,102,241,.4);}
.hdr h1{font-size:18px; margin:0; font-weight:800; letter-spacing:.3px;}
.hdr .sub{font-size:11px; color:var(--txt2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw;}
.hdr .right{margin-left:auto; text-align:right; flex:none;}
.hdr .clock{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;}
.hdr .live{font-size:11px; color:var(--green); display:flex; align-items:center; gap:5px; justify-content:flex-end;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green); box-shadow:0 0 8px var(--green); animation:blink 1.6s infinite;}
@keyframes blink{50%{opacity:.3;}}

/* 告警条 */
.alertbar{display:none; margin:12px 16px 0; padding:11px 14px; border-radius:14px;
  background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.35);
  color:#ffb4b4; font-size:13px; backdrop-filter:blur(12px);}
.alertbar.show{display:block;}
.alertbar b{color:var(--red);}

/* 卡片网格 */
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:14px 16px 8px;}
@media(min-width:640px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media(min-width:960px){ .grid{grid-template-columns:repeat(4,minmax(0,1fr));} }

/* 玻璃卡片 */
.card{
  position:relative; border-radius:20px; padding:13px; cursor:pointer;
  background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.03));
  backdrop-filter:blur(28px) saturate(165%);
  -webkit-backdrop-filter:blur(28px) saturate(165%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.03);
  overflow:hidden; display:flex; flex-direction:column;
  transition:transform .12s ease, box-shadow .2s ease, border-color .2s;
}
.card:active{transform:scale(.96);}
.card::before{content:''; position:absolute; inset:0 0 auto 0; height:90px;
  background:radial-gradient(130% 100% at 50% 0%, var(--glow, rgba(255,255,255,.14)), transparent 72%);
  pointer-events:none;}
.card .top{display:flex; align-items:center; gap:9px; margin-bottom:10px; position:relative; z-index:1;}
.card .ico{width:32px;height:32px; border-radius:10px; flex:none;
  display:flex;align-items:center;justify-content:center; font-size:17px;
  background:linear-gradient(135deg, var(--c1,#444), var(--c2,#666));
  box-shadow:0 4px 12px rgba(0,0,0,.3);}
.card .t{font-weight:700; font-size:14px; letter-spacing:.2px; white-space:nowrap;}
.card .badge{margin-left:auto; font-size:13px; color:rgba(255,255,255,.55); font-weight:700;}
.card .mainval{position:relative; z-index:1; font-size:28px; font-weight:800; line-height:1.05;
  font-variant-numeric:tabular-nums; letter-spacing:-.5px;
  background:linear-gradient(135deg,var(--c1,#fff),var(--c2,#ccc));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.card .mainval small{font-size:13px; font-weight:700; letter-spacing:0;
  -webkit-text-fill-color:var(--txt2); margin-left:3px;}
.card .mainval .na{font-size:22px; -webkit-text-fill-color:var(--txt3);}
.card .subs{position:relative; z-index:1; display:block; margin-top:11px; font-size:11px; color:var(--txt2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.card .sub{display:inline;}
.card .sub .k{font-size:10px; color:var(--txt2); letter-spacing:.2px;}
.card .sub .v{font-size:11.5px; font-weight:650; color:var(--txt); font-variant-numeric:tabular-nums;}
.card .sub .v.na{color:var(--txt3); font-weight:400;}
.card .sep{color:var(--txt3); opacity:.4; margin:0 5px;}
.card .spark{position:relative; z-index:1; margin-top:auto; height:34px; padding-top:8px;}
.card .spark canvas{width:100%; height:100%; display:block;}
.na{color:var(--txt3); font-weight:400;}

/* 抽屉（二级详情） */
.drawer{position:fixed; inset:0; z-index:50; display:none;
  background:rgba(4,6,12,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);}
.drawer.open{display:block;}
.drawer .panel{position:absolute; bottom:0; left:0; right:0; max-height:90vh; overflow:auto;
  background:rgba(17,22,38,.92); backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  border-radius:24px 24px 0 0; border-top:1px solid var(--line2);
  padding:6px 18px calc(env(safe-area-inset-bottom) + 24px);
  animation:up .28s cubic-bezier(.22,1,.36,1);}
@keyframes up{from{transform:translateY(50px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.drawer .ph{display:flex; align-items:center; gap:11px; padding:12px 0 14px;
  position:sticky; top:0; z-index:2; background:transparent;}
.drawer .ph .ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:23px;
  background:linear-gradient(135deg,var(--c1,#444),var(--c2,#666));}
.drawer .ph h2{margin:0; font-size:18px; font-weight:800;}
.drawer .ph .x{margin-left:auto; width:34px;height:34px;border-radius:11px;
  background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);font-size:18px;cursor:pointer;}
.grip{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:8px auto 0;}
.sec{margin-top:16px;}
.sec .sh{font-size:11px; color:var(--txt3); letter-spacing:1.2px; margin-bottom:8px; font-weight:700;}
.sec .item{display:flex; justify-content:space-between; align-items:center; padding:10px 0;
  border-bottom:1px solid var(--line); font-size:14px;}
.sec .item:last-child{border-bottom:none;}
.sec .item .l{color:var(--txt2);}
.sec .item .v{font-weight:600; font-variant-numeric:tabular-nums;}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
.tile{background:var(--glass); border:1px solid var(--line); border-radius:14px; padding:11px 13px;
  backdrop-filter:blur(10px);}
.tile .tl{font-size:11px; color:var(--txt2);}
.tile .tv{font-size:19px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
.chartbox{margin-top:16px; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:12px; backdrop-filter:blur(10px);}
.chartbox canvas{width:100%; height:190px; display:block;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
th{color:var(--txt3); font-weight:600; font-size:11px;}
td{font-variant-numeric:tabular-nums;}
.mono{font-family:"SF Mono",Consolas,monospace; font-size:11.5px;}
.cores{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px;}
.core{background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:9px; text-align:center; backdrop-filter:blur(10px);}
.core .cn{font-size:10px; color:var(--txt2);}
.core .cv{font-size:14px; font-weight:700; margin-top:2px;}
.bar{height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden; margin:4px 0;}
.bar>i{display:block; height:100%; border-radius:3px; transition:width .4s;}

/* 设置 */
.inp{width:100%; background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--txt);
  border-radius:12px; padding:11px 13px; font-size:14px;}
.inp:focus{outline:none; border-color:var(--teal);}
.btn{background:linear-gradient(135deg,#6366f1,#22b8cf); color:#fff; border:none; border-radius:14px;
  padding:14px 18px; font-size:15px; font-weight:800; cursor:pointer; width:100%;
  box-shadow:0 8px 20px rgba(99,102,241,.35);}
.btn:active{opacity:.88;}
.lbl{font-size:13px; color:var(--txt2); margin:14px 0 6px; display:block;}
.switch{display:flex; align-items:center; justify-content:space-between; padding:12px 0;}
.switch input{width:46px;height:26px; accent-color:#6366f1;}
footer{text-align:center; color:var(--txt3); font-size:11px; padding:14px; letter-spacing:.5px;}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>

<div class="hdr">
  <div class="row">
    <div class="logo">🖥️</div>
    <div>
      <h1>电脑监测</h1>
      <div class="sub" id="hostline">连接中…</div>
    </div>
    <div class="right">
      <div class="clock" id="clock">--:--</div>
      <div class="live"><span class="dot"></span><span id="livetxt">实时</span></div>
    </div>
  </div>
</div>

<div class="alertbar" id="alertbar"></div>
<div class="grid" id="grid"></div>
<footer>局域网实时监测 · 添加到主屏幕即可当 APP 使用</footer>

<div class="drawer" id="drawer">
  <div class="panel" id="panel"></div>
</div>

<script>
'use strict';
let S = null;
const HIST = {};
const HIST_MAX = 600;

/* ---------- 取值 ---------- */
function g(path){
  let c = S; if(!c) return null;
  for(const seg of path.split('.')){
    if(c==null) return null;
    if(Array.isArray(c) && /^\d+$/.test(seg)) c = c[+seg];
    else c = c[seg];
  }
  return c;
}

/* ---------- 格式化 ---------- */
function fmtBytes(n){
  if(n==null) return 'N/A';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return (n<10&&i>0? n.toFixed(1): n.toFixed(0))+' '+u[i];
}
function fmtSpeed(n){ return n==null?'N/A':fmtBytes(n)+'/s'; }
function fmtHz(n){
  if(n==null) return 'N/A';
  if(n>=1e9) return (n/1e9).toFixed(2)+' GHz';
  if(n>=1e6) return (n/1e6).toFixed(0)+' MHz';
  return n.toFixed(0)+' Hz';
}
function fmtPct(n){ return n==null?'N/A':(+n).toFixed(1)+'%'; }
function fmtTemp(n){ return n==null?'N/A':(+n).toFixed(0)+'°C'; }
function fmtNum(n,d){ return n==null?'N/A':(+n).toFixed(d==null?0:d); }
function fmtW(n){ return n==null?'N/A':(+n).toFixed(1)+' W'; }
function fmtDur(s){
  if(s==null) return 'N/A';
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  return (d? d+'天 ':'')+h+'时 '+m+'分';
}
function fmtTime(ts){ return ts==null?'N/A':new Date(ts*1000).toLocaleString('zh-CN'); }
function el(id){ return document.getElementById(id); }
function fmtSpeedShort(n){
  const u=['B','KB','MB','GB']; let i=0;
  while(n>=1024 && i<u.length-1){ n/=1024; i++; }
  return `${n.toFixed(n<10&&i>0?1:0)}<small>${u[i]}/s</small>`;
}
/* 紧凑格式化（去掉单位空格，用于卡片副指标，避免溢出） */
function cB(n){ return fmtBytes(n).replace(/\s/g,''); }
function cS(n){ return fmtSpeed(n).replace(/\s/g,''); }
function cH(n){ return fmtHz(n).replace(/\s/g,''); }
function cW(n){ return fmtW(n).replace(/\s/g,''); }
function cD(s){ return fmtDur(s).replace(/\s/g,''); }

/* ---------- 卡片定义 ---------- */
const CARDS = [
  {key:'cpu', icon:'🧠', c1:'#ff6b6b', c2:'#fa5252', title:'CPU',
   main:'cpu.total', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>%</small>`,
   subs:[['cpu.temp_package','温度',v=>fmtTemp(v)],['cpu.freq_current','主频',v=>cH(v)]],
   spark:'cpu.total'},
  {key:'mem', icon:'💾', c1:'#4dabf7', c2:'#3b5bdb', title:'内存',
   main:'memory.percent', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>%</small>`,
   subs:[['memory.used','已用',v=>cB(v)],['memory.total','总量',v=>cB(v)]],
   spark:'memory.percent'},
  {key:'disk', icon:'🗄️', c1:'#3ddc97', c2:'#20c997', title:'硬盘',
   main:'disk.percent_free', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>% 空闲</small>`,
   subs:[['disk.read_speed','读',v=>cS(v)],['disk.write_speed','写',v=>cS(v)]],
   spark:'disk.write_speed'},
  {key:'gpu', icon:'🎮', c1:'#a78bfa', c2:'#7c5cff', title:'GPU',
   main:'gpu.util', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>%</small>`,
   subs:[['gpu.temp','温度',v=>fmtTemp(v)],['gpu.power','功耗',v=>cW(v)]],
   spark:'gpu.util'},
  {key:'net', icon:'🌐', c1:'#51cf66', c2:'#37b24d', title:'网络',
   main:'network.down_speed', mainFmt:v=>v==null?'<span class="na">N/A</span>':fmtSpeedShort(v),
   subs:[['network.up_speed','上传',v=>cS(v)],['network.ping.latency_ms','延迟',v=>v==null?'N/A':Math.round(v)+'ms']],
   spark:'network.down_speed'},
  {key:'thermal', icon:'🌡️', c1:'#ffa94d', c2:'#f76707', title:'温度',
   main:'thermal.gpu', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>°C</small>`,
   subs:[['thermal.cpu','CPU',v=>fmtTemp(v)],['thermal.disk','硬盘',v=>fmtTemp(v)]],
   spark:'thermal.gpu'},
  {key:'power', icon:'🔋', c1:'#a3e635', c2:'#5c940d', title:'电池',
   main:'power.battery_percent', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${v.toFixed(0)}<small>%</small>`,
   subs:[['power.status','状态',v=>v||'N/A'],['power.health','健康',v=>v==null?'N/A':v+'%']],
   spark:'power.battery_percent'},
  {key:'system', icon:'⚙️', c1:'#22b8cf', c2:'#1098ad', title:'系统',
   main:'system.process_count', mainFmt:v=>v==null?'<span class="na">N/A</span>':`${Math.round(v)}<small>进程</small>`,
   subs:[['system.uptime','运行',v=>cD(v)],['cpu.total','CPU',v=>fmtPct(v)]],
   spark:'cpu.total'},
];

const HIST_METRICS = [
  {p:'cpu.total', c:'#ff6b6b', l:'CPU %'},
  {p:'cpu.temp_package', c:'#ffa94d', l:'CPU 温度'},
  {p:'cpu.package_power', c:'#ffd43b', l:'CPU 功耗'},
  {p:'memory.percent', c:'#4dabf7', l:'内存 %'},
  {p:'gpu.util', c:'#a78bfa', l:'GPU %'},
  {p:'gpu.temp', c:'#f472b6', l:'GPU 温度'},
  {p:'gpu.power', c:'#3ddc97', l:'GPU 功耗'},
  {p:'disk.read_speed', c:'#22b8cf', l:'读'},
  {p:'disk.write_speed', c:'#3ddc97', l:'写'},
  {p:'network.down_speed', c:'#4dabf7', l:'下载'},
  {p:'network.up_speed', c:'#3ddc97', l:'上传'},
  {p:'power.battery_percent', c:'#a3e635', l:'电量'},
  {p:'thermal.gpu', c:'#ffa94d', l:'温度'},
];

/* ---------- 渲染卡片 ---------- */
function buildCards(){
  const grid = el('grid'); grid.innerHTML = '';
  CARDS.forEach(card=>{
    const d = document.createElement('div');
    d.className = 'card';
    d.style.setProperty('--c1', card.c1);
    d.style.setProperty('--c2', card.c2);
    d.style.setProperty('--glow', hexA(card.c1, .18));
    d.innerHTML = `
      <div class="top"><span class="ico">${card.icon}</span><span class="t">${card.title}</span><span class="badge">›</span></div>
      <div class="mainval" id="mv-${card.key}">—</div>
      <div class="subs" id="sub-${card.key}"></div>
      <div class="spark"><canvas></canvas></div>`;
    d.addEventListener('click', ()=>openCard(card.key));
    grid.appendChild(d);
  });
  // 设置卡片
  const s = document.createElement('div');
  s.className = 'card';
  s.style.setProperty('--c1','#868e96'); s.style.setProperty('--c2','#495057'); s.style.setProperty('--glow','rgba(255,255,255,.06)');
  s.innerHTML = `
    <div class="top"><span class="ico">🔧</span><span class="t">设置</span><span class="badge">›</span></div>
    <div class="mainval">⚙<small>采样/告警</small></div>
    <div class="subs">
      <span class="sub"><span class="k">间隔</span><span class="v" id="set-interval">—</span></span>
      <span class="sep">·</span>
      <span class="sub"><span class="k">告警</span><span class="v" id="set-alert">—</span></span>
    </div>
    <div class="spark"></div>`;
  s.addEventListener('click', openSettings);
  grid.appendChild(s);
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function render(){
  if(!S) return;
  const h = S.host||{};
  el('hostline').textContent = `${h.hostname||''} · ${h.platform||''} ${h.release||''}`;
  CARDS.forEach(card=>{
    const mv = el('mv-'+card.key);
    if(mv) mv.innerHTML = card.mainFmt(g(card.main));
    const sub = el('sub-'+card.key);
    if(sub) sub.innerHTML = card.subs.map(([p,label,fmt],i)=>{
      const v = g(p);
      const val = v==null ? 'N/A' : fmt(v);
      return `${i?'<span class="sep">·</span>':''}<span class="sub"><span class="k">${label}</span><span class="v ${v==null?'na':''}">${val}</span></span>`;
    }).join('');
    drawSpark(card.key);
  });
  updateSettingsCard();
  renderAlerts(S.alerts||[]);
}

/* ---------- 曲线 ---------- */
function pushHist(){
  const t = S.time;
  HIST_METRICS.forEach(m=>{
    const v = g(m.p); if(v==null) return;
    (HIST[m.p] || (HIST[m.p]=[])).push({t,v});
    if(HIST[m.p].length>HIST_MAX) HIST[m.p].shift();
  });
}
function drawSpark(key){
  const card = CARDS.find(c=>c.key===key);
  if(!card) return;
  const box = el('spark-'+key);
  const cv = box && box.querySelector('canvas');
  if(!cv) return;
  const a = HIST[card.spark]||[];
  drawLine(cv, a.map(x=>x.v), card.c1);
}
function drawLine(canvas, data, color, withAxis){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||150, h = canvas.clientHeight||34;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!data || data.length<2){
    ctx.fillStyle='rgba(154,165,184,.5)'; ctx.font='10px sans-serif';
    ctx.fillText('· 等待数据', 2, h-2); return;
  }
  const min=Math.min(...data), max=Math.max(...data);
  const range=(max-min)||1, pad=2;
  const dx=w/(data.length-1);
  if(withAxis){
    ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1;
    for(let i=0;i<=3;i++){ const y=pad+(h-2*pad)*i/3; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  }
  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, hexA(color,.4)); grad.addColorStop(1, hexA(color,0));
  ctx.beginPath();
  data.forEach((v,i)=>{ const x=i*dx, y=pad+(h-2*pad)*(1-(v-min)/range); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo((data.length-1)*dx,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle=grad; ctx.fill();
  if(withAxis){
    ctx.fillStyle='rgba(154,165,184,.8)'; ctx.font='10px sans-serif';
    ctx.fillText(max.toFixed(0),2,pad+8); ctx.fillText(min.toFixed(0),2,h-2);
  }
}

/* ---------- 告警 ---------- */
function renderAlerts(alerts){
  const bar = el('alertbar');
  if(!alerts||!alerts.length){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  bar.innerHTML = alerts.map(a=>`<div>⚠️ <b>${a.message}</b></div>`).join('');
}

/* ---------- 详情抽屉 ---------- */
function openCard(key){
  const card = CARDS.find(c=>c.key===key);
  const panel = el('panel');
  panel.innerHTML = `<div class="grip"></div>
    <div class="ph"><span class="ico" style="background:linear-gradient(135deg,${card.c1},${card.c2})">${card.icon}</span>
    <h2>${card.title}</h2><button class="x" onclick="closeDrawer()">✕</button></div>
    <div class="chartbox"><canvas id="detailchart"></canvas></div>` + detailBody(key);
  el('drawer').classList.add('open');
  setTimeout(()=>{
    const cv = el('detailchart'); if(!cv) return;
    drawMulti(cv, HIST_METRICS.filter(m=>relatedMetrics(key).includes(m.p)));
  },30);
}
function relatedMetrics(key){
  const map = {
    cpu:['cpu.total','cpu.temp_package','cpu.package_power'],
    mem:['memory.percent'], disk:['disk.read_speed','disk.write_speed'],
    gpu:['gpu.util','gpu.temp','gpu.power'], net:['network.down_speed','network.up_speed'],
    thermal:['thermal.gpu'], power:['power.battery_percent','gpu.power','cpu.package_power'], system:['cpu.total'],
  };
  return map[key]||[];
}
function drawMulti(canvas, series){
  const valid = series.filter(s=>HIST[s.p]&&HIST[s.p].length>=2);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||300, h=190;
  canvas.width=w*dpr; canvas.height=h*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(!valid.length){ ctx.fillStyle='rgba(154,165,184,.7)'; ctx.font='13px sans-serif'; ctx.fillText('暂无历史数据（随采样累积）',10,h/2); return; }
  ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=8+(h-30)*i/4; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  valid.forEach(s=>{
    const a=HIST[s.p], max=Math.max(...a.map(x=>x.v))||1;
    ctx.beginPath();
    a.forEach((pt,i)=>{ const x=i/(a.length-1)*(w-10)+5, y=8+(h-30)*(1-pt.v/max); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle=s.c; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
  });
  ctx.font='11px sans-serif'; let lx=10, ly=h-8;
  valid.forEach(s=>{ ctx.fillStyle=s.c; ctx.fillRect(lx,ly-8,12,3); ctx.fillStyle='rgba(154,165,184,.9)'; ctx.fillText(s.l,lx+16,ly-1); lx+=58; });
}
function closeDrawer(){ el('drawer').classList.remove('open'); }
function item(l,v,mono){ return `<div class="item"><span class="l">${l}</span><span class="v${mono?' mono':''}">${v}</span></div>`; }

function detailBody(key){
  const c = S||{};
  if(key==='cpu'){
    const cpu=c.cpu||{};
    const pc=(cpu.per_core||[]).map((v,i)=>`<div class="core"><div class="cn">核${i}</div><div class="cv">${v==null?'N/A':v.toFixed(0)+'%'}</div><div class="bar"><i style="width:${v||0}%;background:linear-gradient(90deg,#ff6b6b,#fa5252)"></i></div></div>`).join('');
    const ct=(cpu.temp_per_core||[]).map((s,i)=>`<div class="core"><div class="cn">${s.name||('核'+i)}</div><div class="cv">${fmtTemp(s.value)}</div></div>`).join('');
    return `
    <div class="sec"><div class="sh">概览</div><div class="grid2">
      <div class="tile"><div class="tl">总使用率</div><div class="tv">${fmtPct(cpu.total)}</div></div>
      <div class="tile"><div class="tl">当前主频</div><div class="tv">${fmtHz(cpu.freq_current)}</div></div>
      <div class="tile"><div class="tl">基频 / 睿频</div><div class="tv" style="font-size:15px">${fmtHz(cpu.freq_base)} / ${fmtHz(cpu.freq_max)}</div></div>
      <div class="tile"><div class="tl">封装温度</div><div class="tv">${fmtTemp(cpu.temp_package)}</div></div>
      <div class="tile"><div class="tl">封装功耗</div><div class="tv">${fmtW(cpu.package_power)}</div></div>
      <div class="tile"><div class="tl">核心数</div><div class="tv">${cpu.count_physical??'?'}核/${cpu.count_logical??'?'}线程</div></div>
    </div></div>
    <div class="sec"><div class="sh">时间占用</div>
      ${item('用户态',fmtPct(cpu.user))}${item('内核态',fmtPct(cpu.system))}${item('中断(IRQ/DPC)',fmtPct(cpu.irq))}${item('空闲',fmtPct(cpu.idle))}
    </div>
    <div class="sec"><div class="sh">系统指标</div>
      ${item('处理器队列长度',fmtNum(cpu.queue_length))}${item('中断/秒',fmtNum(cpu.interrupts_per_sec,0))}${item('型号',cpu.name||'N/A')}
    </div>
    <div class="sec"><div class="sh">每核心使用率</div><div class="cores">${pc||'<span class="na">N/A</span>'}</div></div>
    ${ct?`<div class="sec"><div class="sh">每核心温度</div><div class="cores">${ct}</div></div>`:''}`;
  }
  if(key==='mem'){
    const m=c.memory||{};
    return `
    <div class="sec"><div class="sh">容量</div>
      ${item('已用',fmtBytes(m.used))}${item('可用',fmtBytes(m.available))}${item('总量',fmtBytes(m.total))}${item('使用率',fmtPct(m.percent))}
    </div>
    <div class="sec"><div class="sh">提交与交换</div>
      ${item('提交量',fmtBytes(m.commit_used))}${item('提交上限',fmtBytes(m.commit_limit))}${item('页面交换 Pages/sec',fmtNum(m.pages_per_sec,0))}
    </div>
    <div class="sec"><div class="sh">缓存与池</div>
      ${item('缓存大小',fmtBytes(m.cached))}${item('非分页池',fmtBytes(m.nonpaged_pool))}${item('分页池',fmtBytes(m.paged_pool))}
    </div>
    <div class="sec"><div class="sh">内存条</div>
      ${item('频率',m.freq_mhz?m.freq_mhz+' MHz':'N/A')}${item('时序(CL)','N/A（需 CPU-Z）')}${item('模块数',m.mem_modules??'N/A')}${item('总容量',fmtBytes(m.mem_capacity))}
    </div>`;
  }
  if(key==='disk'){
    const d=c.disk||{};
    const parts=(d.partitions||[]).map(p=>item(`${p.mount}`, `${fmtBytes(p.free)} 空闲 / ${fmtBytes(p.total)}`)).join('');
    return `
    <div class="sec"><div class="sh">吞吐</div>
      ${item('读取速度',fmtSpeed(d.read_speed))}${item('写入速度',fmtSpeed(d.write_speed))}
      ${item('读延迟',d.read_latency_ms!=null?fmtNum(d.read_latency_ms,2)+' ms':'N/A')}${item('写延迟',d.write_latency_ms!=null?fmtNum(d.write_latency_ms,2)+' ms':'N/A')}
      ${item('磁盘忙碌',fmtPct(d.busy_percent))}${item('队列长度',fmtNum(d.queue_length,2))}
    </div>
    <div class="sec"><div class="sh">分区空间</div>${parts||'<div class="na">N/A</div>'}</div>
    <div class="sec"><div class="sh">SMART 健康</div>
      ${item('温度',fmtTemp(d.temp))}${item('SSD 磨损/寿命',d.wear!=null?d.wear+'%':'N/A')}
      ${item('寿命已用',d.percent_used!=null?d.percent_used+'%':'N/A')}${item('通电时长',d.power_on_hours!=null?d.power_on_hours+' 小时':'N/A')}
    </div>`;
  }
  if(key==='gpu'){
    const g2=c.gpu||{};
    const list=(g2.list||[]).map(gp=>`<div class="tile"><div class="tl">${gp.name}</div><div class="tv">${fmtPct(gp.util)}</div></div>`).join('');
    const procs=(g2.processes||[]).map(p=>`<tr><td>${p.pid}</td><td class="mono">${p.name||''}</td><td>${p.vram!=null?fmtBytes(p.vram):'N/A'}</td></tr>`).join('');
    return `
    <div class="sec"><div class="sh">GPU 列表</div><div class="grid2">${list||'<div class="na">N/A</div>'}</div></div>
    <div class="sec"><div class="sh">主要 GPU（${g2.name||'N/A'}）</div>
      ${item('使用率',fmtPct(g2.util))}${item('显存',`${fmtBytes(g2.vram_used)} / ${fmtBytes(g2.vram_total)}`)}
      ${item('核心温度',fmtTemp(g2.temp))}${item('实时功耗 / 上限',`${fmtW(g2.power)} / ${fmtW(g2.power_limit)}`)}
      ${item('核心频率',fmtHz(g2.core_clock))}${item('显存频率',fmtHz(g2.mem_clock))}
      ${item('风扇转速',g2.fan!=null?g2.fan+' %':'N/A')}${item('性能状态',g2.pstate||'N/A')}
      ${item('编码 / 解码',(g2.encode??'N/A')+' / '+(g2.decode??'N/A'))}
    </div>
    <div class="sec"><div class="sh">占用进程</div>
      ${procs?`<table><tr><th>PID</th><th>进程</th><th>显存</th></tr>${procs}</table>`:'<div class="na">无（NVIDIA 才可获取）</div>'}
    </div>`;
  }
  if(key==='net'){
    const n=c.network||{};
    const tcpRows=Object.entries(n.tcp_by_state||{}).map(([k,v])=>item(k,v)).join('');
    const ping=n.ping||{};
    return `
    <div class="sec"><div class="sh">实时速率</div>
      ${item('下载速度',fmtSpeed(n.down_speed))}${item('上传速度',fmtSpeed(n.up_speed))}
    </div>
    <div class="sec"><div class="sh">累计流量</div>
      ${item('累计接收',fmtBytes(n.down_total))}${item('累计发送',fmtBytes(n.up_total))}${item('输出队列长度',n.output_queue!=null?n.output_queue:'N/A')}
    </div>
    <div class="sec"><div class="sh">Ping</div>
      ${item('目标',ping.target||'N/A')}${item('延迟',ping.latency_ms!=null?ping.latency_ms+' ms':'N/A')}${item('丢包',ping.loss!=null?ping.loss+'%':'N/A')}
    </div>
    <div class="sec"><div class="sh">TCP 连接（共 ${n.tcp_total??0}）</div>${tcpRows||'<div class="na">N/A</div>'}</div>`;
  }
  if(key==='thermal'){
    const t=c.thermal||{};
    const fans=(t.fans||[]).map(f=>item(f.name, fmtNum(f.value,0)+' RPM')).join('');
    const volts=(t.voltages||[]).map(f=>item(f.name, fmtNum(f.value,3)+' V')).join('');
    return `
    <div class="sec"><div class="sh">温度</div>
      ${item('CPU',fmtTemp(t.cpu))}${item('GPU',fmtTemp(t.gpu))}${item('硬盘',fmtTemp(t.disk))}${item('主板',fmtTemp(t.motherboard))}
    </div>
    <div class="sec"><div class="sh">风扇转速</div>${fans||'<div class="na">N/A（需 LibreHardwareMonitor）</div>'}</div>
    <div class="sec"><div class="sh">各路电压</div>${volts||'<div class="na">N/A（需 LibreHardwareMonitor）</div>'}</div>`;
  }
  if(key==='power'){
    const p=c.power||{};
    return `
    <div class="sec"><div class="sh">电池</div>
      ${item('电量',p.battery_percent!=null?p.battery_percent+'%':'N/A')}${item('状态',p.status||'N/A')}
      ${item('充/放电功率',fmtW(p.charge_power))}${item('剩余续航',p.time_left_sec!=null?fmtDur(p.time_left_sec):'N/A')}
      ${item('电池健康度',p.health!=null?p.health+'%':'N/A')}${item('循环次数',p.cycle??'N/A')}
    </div>
    <div class="sec"><div class="sh">实时功耗</div>
      ${item('CPU 功耗',fmtW(c.cpu.package_power))}${item('GPU 功耗',fmtW(c.gpu.power))}
    </div>`;
  }
  if(key==='system'){
    const s=c.system||{};
    const rows=(s.processes||[]).map(p=>`<tr><td>${p.pid}</td><td class="mono">${p.name||''}</td><td>${p.cpu!=null?p.cpu.toFixed(1)+'%':'N/A'}</td><td>${fmtBytes(p.mem)}</td><td>${p.threads??'N/A'}</td></tr>`).join('');
    const parts=(s.partitions||[]).map(p=>item(p.mount,`${fmtBytes(p.free)} 空闲 / ${fmtBytes(p.total)}`)).join('');
    return `
    <div class="sec"><div class="sh">运行概况</div>
      ${item('运行时间',fmtDur(s.uptime))}${item('启动时间',fmtTime(s.boot_time))}${item('系统负载',fmtNum(s.load,2))}
    </div>
    <div class="sec"><div class="sh">统计</div>
      ${item('进程数',s.process_count??'N/A')}${item('线程数',s.thread_count??'N/A')}${item('句柄数',s.handle_count??'N/A')}
    </div>
    <div class="sec"><div class="sh">各分区空间</div>${parts||'<div class="na">N/A</div>'}</div>
    <div class="sec"><div class="sh">进程列表（CPU 前 15）</div>
      <table><tr><th>PID</th><th>进程</th><th>CPU</th><th>内存</th><th>线程</th></tr>${rows||''}</table>
    </div>`;
  }
  return '';
}

/* ---------- 设置 ---------- */
function openSettings(){
  const panel = el('panel');
  panel.innerHTML = `<div class="grip"></div>
    <div class="ph"><span class="ico" style="background:linear-gradient(135deg,#868e96,#495057)">🔧</span>
    <h2>设置</h2><button class="x" onclick="closeDrawer()">✕</button></div>
    <div class="sec">
      <span class="lbl">采样间隔（秒，越小越实时）</span>
      <input class="inp" id="cfg-interval" type="number" step="0.2" min="0.2" value="${cfg.interval}">
      <span class="lbl">Ping 目标（auto=默认网关）</span>
      <input class="inp" id="cfg-ping" type="text" value="${cfg.ping_target}">
      <div class="switch"><span style="color:var(--txt2)">启用阈值告警</span><input id="cfg-alert" type="checkbox" ${cfg.alerts_enabled?'checked':''}></div>
      ${thrInputs()}
      <button class="btn" style="margin-top:20px" onclick="saveSettings()">保存设置</button>
    </div>`;
  el('drawer').classList.add('open');
}
function thrInputs(){
  const t=cfg.thresholds||{};
  const labels={cpu_temp:'CPU 温度(°C)',gpu_temp:'GPU 温度(°C)',disk_temp:'硬盘温度(°C)',cpu_percent:'CPU 使用率(%)',gpu_percent:'GPU 使用率(%)',mem_percent:'内存使用率(%)',disk_free_percent:'磁盘剩余低于(%)',battery_low:'电池低电量(%)'};
  return Object.keys(labels).map(k=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;">
      <span style="color:var(--txt2);font-size:13px">${labels[k]}</span>
      <input class="inp" style="width:84px;text-align:right" id="th-${k}" type="number" value="${t[k]!=null?t[k]:''}">
    </div>`).join('');
}
async function saveSettings(){
  const data={interval:parseFloat(el('cfg-interval').value)||1, ping_target:el('cfg-ping').value||'auto', alerts_enabled:el('cfg-alert').checked, thresholds:{}};
  ['cpu_temp','gpu_temp','disk_temp','cpu_percent','gpu_percent','mem_percent','disk_free_percent','battery_low'].forEach(k=>{ const v=parseFloat(el('th-'+k).value); if(!isNaN(v)) data.thresholds[k]=v; });
  try{ await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); closeDrawer(); }catch(e){}
}

/* ---------- 配置 & 连接 ---------- */
let cfg={interval:1,ping_target:'auto',alerts_enabled:true,thresholds:{}};
async function loadConfig(){ try{ cfg=await (await fetch('/api/config')).json(); updateSettingsCard(); }catch(e){} }
function updateSettingsCard(){
  if(el('set-interval')) el('set-interval').textContent = cfg.interval+' s';
  if(el('set-alert')) el('set-alert').textContent = cfg.alerts_enabled?'开':'关';
}
function connect(){
  const es=new EventSource('/api/stream');
  es.onmessage=e=>{ try{ S=JSON.parse(e.data); el('livetxt').textContent='实时'; el('livetxt').style.color=''; pushHist(); render(); }catch(err){} };
  es.onerror=()=>{ el('livetxt').textContent='重连中'; el('livetxt').style.color='var(--orange)'; es.close(); setTimeout(connect,2000); };
}

/* ---------- 时钟 ---------- */
function tickClock(){ const d=new Date(); el('clock').textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
setInterval(tickClock, 10000);

/* ---------- 启动 ---------- */
buildCards();
tickClock();
if(location.search.includes('static')){
  fetch('/api/snapshot').then(r=>r.json()).then(d=>{ S=d; render(); });
}else{
  loadConfig().then(()=>connect());
}
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
